# Velum Enterprise - Netlify configuration
# Static site, no build step. Everything published lives in ./site

[build]
  publish = "site"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

# ----- Headers -------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # connect-src and form-action name docs.google.com because the contact form
    # posts to Google Forms. Everything else stays locked to 'self'.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://docs.google.com; form-action 'self' https://docs.google.com; frame-ancestors 'self'; base-uri 'self'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://identity.netlify.com; connect-src 'self' https://identity.netlify.com; font-src 'self'; frame-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

# Fingerprint-free assets, so cache conservatively but usefully.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# ----- Redirects -----------------------------------------------------------
# Friendly URLs alongside the .html files.
#
# Note: pretty_urls above already strips ".html", so /gracias.html serves at
# /gracias on its own. Do NOT add a /gracias -> /gracias.html rule: the two
# rules redirect into each other and the page dies with ERR_TOO_MANY_REDIRECTS.
# The Spanish-language aliases below are safe because the source and target
# differ after the .html is stripped (/casas -> /houses, not /casas).
[[redirects]]
  from = "/casas"
  to = "/houses.html"
  status = 301
[[redirects]]
  from = "/grupo"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/contacto"
  to = "/contact.html"
  status = 301
